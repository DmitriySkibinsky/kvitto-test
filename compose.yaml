services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kvitto
      POSTGRES_USER: kvitto
      POSTGRES_PASSWORD: kvitto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvitto -d kvitto"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://kvitto:kvitto@db:5432/kvitto
      WEBHOOK_SECRET: dev-secret
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
