[project]
name = "kvitto-payment-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "aiosqlite>=0.21,<1",
  "alembic>=1.15,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
exclude = [
  "alembic",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]